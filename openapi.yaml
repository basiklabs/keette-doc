  /swaps:
    post:
      operationId: createSwap
      tags: [Swaps]
      summary: Create Swap
      description: |
        Move funds between your own books using a firm quote from
        `POST /fx/quotes` with `purpose: swap`. Requires `Idempotency-Key`.
        The API key replaces the workspace PIN. Both quote `from` and `to`
        currencies must already exist on `GET /balances`; otherwise the
        request is rejected (`parameter_invalid`).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key so retries do not create duplicate swaps.
          schema: { type: string, minLength: 1, maxLength: 128 }
          example: swap-2026-10-27-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quote_id]
              properties:
                quote_id:
                  type: string
                  format: uuid
                  description: |
                    Id from `POST /fx/quotes` with `purpose: swap`. Must still be
                    unexpired and unused.
                  example: "e6bd10ee-6e53-4aaa-9cd0-a2bb980cf73e"
            examples:
              swap:
                value:
                  quote_id: "e6bd10ee-6e53-4aaa-9cd0-a2bb980cf73e"
      responses:
        "200":
          description: "Swap (processing, completed, or failed)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Swap"
              examples:
                processing:
                  value:
                    object: swap
                    note: "Book-to-book transfer. `from` is the debit; `to` is the credit."
                    id: "14d2759d-c6b1-5e5f-85b2-af84bc650f57"
                    status: processing
                    origin: keette
                    from:
                      object: swap_from
                      note: Source book — what leaves this balance.
                      currency: USD
                      scale: 2
                      amount: 100
                      amount_minor: 10000
                      clear_amount: "100.00"
                    to:
                      object: swap_to
                      note: Destination book — what is credited after conversion.
                      currency: NGN
                      scale: 2
                      amount: 15500
                      amount_minor: 1550000
                      clear_amount: "15,500.00"
                    fx_rate: "155.00"
                    quote_id: "e6bd10ee-6e53-4aaa-9cd0-a2bb980cf73e"
                    stan: SWP-2610-ABCDEF12
                    created_at: "2026-10-27T13:00:00Z"
                    updated_at: "2026-10-27T13:00:01Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /swaps/{id}:
    get:
      operationId: getSwap
