                $ref: "#/components/schemas/Payin"
              examples:
                bank:
                  value:
                    object: payin
                    id: "a1b2c3d4-e5f6-7890-abcd-ef1234567890"
                    status: pending
                    method: bank_transfer
                    target_currency: NGN
                    amount: 5000000
                    collection_mode: bank_details
                    stan: IN-2610-ABCDEF12
                    instructions:
                      account_name: Keette Collections
                      account_number: "0123456789"
                      bank_name: Guaranty Trust Bank
                      bank_code: "058"
                    created_at: "2026-10-27T13:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payins:
    post:
      operationId: createPayin
      tags: [Payins]
      summary: Create Payin
      description: |
        Start a partner funding session (`bank_transfer`, momo, Interac,
        crypto checkout). Prefer `POST /payins/prepare` for static bank /
        crypto address instructions. Requires `Idempotency-Key`.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key so retries return the same attempt.
          schema: { type: string, minLength: 1, maxLength: 64 }
          example: payin-2026-10-27-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayinRequest"
            examples:
              bank_transfer:
                value:
                  method: bank_transfer
                  target_currency: GBP
                  amount: 10000
                  redirect_url: https://merchant.example/payins/return
      responses:
        "200":
          description: Funding attempt (may include checkout_url)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payin"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payins/{id}:
    get:
      operationId: getPayin
      tags: [Payins]
      summary: Get Payin
      parameters:
        - name: id
          in: path
          required: true
          description: Payin attempt id.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Payin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payin"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: |
        Secret API key from **Settings → Developers → API keys**.
        Example: `Authorization: Bearer sk_test_…`
  responses:
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: authentication_error
              code: invalid_api_key
              message: Invalid API key provided.
    Forbidden:
      description: API disabled for this tenant or globally
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              type: permission_error
              code: api_disabled
              message: Public API access is disabled for this workspace.
  schemas:
    FxRate:
      type: object
      required: [from, to, rate, asOf, indicative]
      properties:
        from:
          type: string
          description: Source currency.
          example: NGN
        to:
          type: string
          description: Destination currency.
          example: KES
        rate:
          type: string
          description: Units of `to` bought by 1 unit of `from` (decimal string).
          example: "0.096585"
        asOf:
          type: string
          format: date-time
          description: When the rate was observed.
        indicative:
          type: boolean
          description: Always true for `GET /fx/rate` — not a firm lock.
        disclaimer:
          type: string
          description: |
            Present when the rate came from market failover rather than the
            partner rail. Typically "Rates are indicative and not final."
          example: Rates are indicative and not final.
    Me:
      type: object
      required: [object, tenant_id, environment, key]
      properties:
        object:
          type: string
          enum: [me]
          description: Object type discriminator.
        tenant_id:
          type: string
          description: Workspace id bound to this API key.
        environment:
          type: string
          enum: [live, sandbox]
          description: "Environment selected by the key (`sk_live_…` vs `sk_test_…`)."
        key:
          type: object
          description: Non-secret metadata for the authenticating key.
          required: [id, prefix, name]
          properties:
            id:
              type: string
              description: Internal key id.
            prefix:
              type: string
              description: Non-secret key prefix shown in the dashboard.
            name:
              type: string
              description: Display name of the key from the dashboard.
    Event:
      type: object
      required: [id, object, type, created, livemode, data]
      properties:
        id:
          type: string
          format: uuid
          description: Event id (also used for webhook delivery tracking).
        object:
          type: string
          enum: [event]
          description: Object type discriminator.
        type:
          type: string
          description: "Event type string (e.g. `event.ping`, `event.payout.completed`)."
          example: event.ping
        created:
          type: integer
          description: Unix seconds when the event was persisted.
        livemode:
          type: boolean
          description: "`true` when emitted in the live environment."
        environment:
          type: string
          enum: [live, sandbox]
          description: Environment that produced the event.
        data:
          type: object
          additionalProperties: true
          description: "Event-specific payload (shape depends on `type`)."
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, code, message]
          properties:
            type:
              type: string
              description: Broad error class for client handling.
              enum:
                - invalid_request
                - authentication_error
                - permission_error
                - rate_limit
                - api_error
            code:
              type: string
              description: "Stable machine-readable code (e.g. `parameter_invalid`)."
            message:
              type: string
              description: Human-readable explanation safe to show developers.
            param:
              type: string
              description: "Request field that failed validation, when applicable."
            doc_url:
              type: string
              format: uri
              description: Optional link to docs for this error.
    Bank:
      type: object
      properties:
        object:
          type: string
          enum: [bank]
        country:
          type: string
          description: ISO country of the directory entry.
        currency:
          type: string
          description: Primary currency for transfers to this bank.
        code:
          type: string
          description: "Value to send as `routing.bank_code` / `bankCode`."
          example: "058"
        name:
          type: string
          description: Display name.
        type:
          type: string
          description: Optional bank type from the directory.
    BankResolve:
      type: object
      properties:
        object:
          type: string
          enum: [bank_resolve]
        account_number:
          type: string
        account_name:
          type: string
          description: Registered name at the bank.
        bank_code:
          type: string
        bank_name:
          type: string
    BankBic:
      type: object
      properties:
        object:
          type: string
          enum: [bank_bic]
        bic:
          type: string
        country:
          type: string
        found:
          type: boolean
        bank_name:
          type: string
        branch:
          type: string
        address:
          type: object
          additionalProperties:
            type: string
    BeneficiaryRelationship:
      type: string
      description: |
        How the recipient relates to your workspace. Exact codes only —
        see [Relationships & purposes](/guides/relationships-and-purposes)
        or `GET /corridors` → `relationships`.
      enum:
        - vendor
        - supplier
        - contractor
        - employee
        - customer
        - partner
        - family
        - self
        - other
      example: supplier
    PayoutPurpose:
      type: string
      description: |
        Why you are sending. Exact codes only —
        see [Relationships & purposes](/guides/relationships-and-purposes)
        or `GET /payouts/purposes`. Business workspaces cannot use
        `family_support`. `other` requires a non-empty `note`.
      enum:
        - supplier_goods
        - services
        - professional_fees
        - salaries
        - rent
        - tax
        - loan_repayment
        - intercompany
        - investment
        - family_support
        - other
      example: supplier_goods
    CreateBeneficiaryRequest:
      type: object
      required: [kind, currency, scheme, routing, email, address]
      properties:
        kind:
          type: string
          enum: [individual, business, person]
          description: |
            Recipient type. Use `individual` with `first_name` / `last_name`, or
            `business` with `business_name`. `person` is accepted as an alias of
            `individual` and stored as `individual`.
          example: individual
        first_name:
          type: string
          description: "Given name (required when `kind` is `individual` or `person`)."
          example: Ada
        last_name:
          type: string
          description: "Family name (required when `kind` is `individual` or `person`)."
          example: Okoye
        business_name:
          type: string
          description: "Legal business name (required when `kind` is `business`)."
        nickname:
          type: string
          description: Optional label shown in your dashboard and lists.
        email:
          type: string
          format: email
          description: Contact email for the recipient (required).
        relationship:
          $ref: "#/components/schemas/BeneficiaryRelationship"
        address:
          $ref: "#/components/schemas/Address"
        currency:
          type: string
          description: Payout currency the recipient receives (must match the scheme).
          example: NGN
        country:
          type: string
          description: "ISO 3166-1 alpha-2 country for the corridor (e.g. `NG`)."
          example: NG
        scheme:
          type: string
          description: |
            Corridor scheme id from `GET /corridors` (e.g. `ng_nip`, `ke_mpesa`,
            `eu_sepa`, `us_ach`). Determines required `routing` keys.
          example: ng_nip
        holder_name:
          type: string
          description: |
            Account holder name as registered with the receiving bank or wallet.
            Optional; defaults to the individual or business display name.
          example: Ada Okoye
        routing:
          type: object
          additionalProperties: true
          description: |
            Scheme-specific account identifiers. Keys match corridor field `key`
            values from `GET /corridors` (camelCase, e.g. `bankCode`). Snake_case
            aliases (`bank_code`, `account_number`) are accepted. Unknown keys are
            dropped.
          example:
            bank_code: "044"
            account_number: "0690000031"
    UpdateBeneficiaryRequest:
      type: object
      properties:
        nickname:
          type: string
          description: Display label for lists and the dashboard.
        email:
          type: string
          format: email
          description: Contact email.
        relationship:
          $ref: "#/components/schemas/BeneficiaryRelationship"
        address:
          $ref: "#/components/schemas/Address"
    Address:
      type: object
      description: |
        Postal address for the recipient. On create, `line_1`, `city`, and
        `country` are required. CamelCase aliases (`line1`, `postalCode`) are
        accepted on input.
      required: [line_1, city, country]
      properties:
        line_1:
          type: string
          description: Street address line 1.
        line_2:
          type: string
          description: Street address line 2.
        city:
          type: string
          description: City or town.
        state:
          type: string
          description: "State, province, or region."
        postal_code:
          type: string
          description: Postal or ZIP code.
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
    Beneficiary:
      type: object
      properties:
        object:
          type: string
          enum: [beneficiary]
          description: Object type discriminator.
        id:
          type: string
          format: uuid
          description: "Beneficiary id — pass as `beneficiary_id` on payouts."
        kind:
          type: string
          enum: [individual, business]
          description: "Recipient type as stored (`person` on create is normalized to `individual`)."
        name:
          type: string
          description: Display name derived from individual or business fields.
        first_name:
          type: string
          description: "Given name when `kind` is `individual`."
        last_name:
          type: string
          description: "Family name when `kind` is `individual`."
        business_name:
          type: string
          description: "Legal name when `kind` is `business`."
        nickname:
          type: string
          description: Optional display label.
        email:
          type: string
          description: Contact email.
        relationship:
          $ref: "#/components/schemas/BeneficiaryRelationship"
        address:
          $ref: "#/components/schemas/Address"
        currency:
          type: string
          description: Currency the recipient is paid in.
        country:
          type: string
          description: Corridor country.
        method:
          type: string
          description: "High-level rail family (`bank`, `mobile_money`, …)."
        scheme:
          type: string
          description: Corridor scheme id.
        scheme_label:
          type: string
          description: Human-readable scheme name.
        settlement:
          type: string
          description: "Typical settlement timing (e.g. Instant, Same day)."
        holder_name:
          type: string
          description: Account holder name on the rail.
        routing:
          type: object
          additionalProperties: true
          description: Scheme-specific account identifiers (may be partially masked).
        route_label:
          type: string
          description: Short label for the destination account.
        status:
          type: string
          description: "Lifecycle status (`active`, `archived`, …)."
        missing_fields:
          type: array
          items: { type: string }
          description: Fields still required before the beneficiary can be paid.
        created_at:
          type: string
          format: date-time
          description: When the beneficiary was created (UTC).
        updated_at:
          type: string
          format: date-time
          description: When the beneficiary was last updated (UTC).
        archived_at:
          type: string
          format: date-time
          description: "When archived, if applicable."
        livemode:
          type: boolean
          description: "`true` when created with a live key."
        environment:
          type: string
          enum: [live, sandbox]
          description: Environment of the creating API key.
    Balance:
      type: object
      properties:
        object:
          type: string
          enum: [balance]
        id:
          type: string
          format: uuid
          description: |
            Balance / book id. Pass as `balance_id` on payout create and fee
            so Keette knows which book money leaves.
          example: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
        currency:
          type: string
        available:
          type: number
          description: Spendable balance in major units (6 decimal places).
          example: 20000.000000
        available_minor:
          type: integer
          description: Ledger minor units for `available`.
        clear_available:
          type: string
          description: Comma-separated display for `available`.
          example: "20,000.00"
        clear_balance:
          type: string
          description: Same as `clear_available` (readable book balance).
          example: "20,000.00"
        held:
          type: number
          description: Held balance in major units (6 decimal places).
          example: 0.000000
        held_minor:
          type: integer
        clear_held:
          type: string
          example: "0.00"
        scale:
          type: integer
          description: Ledger decimal places for this currency (2 fiat, 6 stablecoins).
        livemode:
          type: boolean
        environment:
          type: string
          enum: [live, sandbox]
        details_available:
          type: boolean
    CreatePayoutRequest:
      type: object
      required: [beneficiary_id, balance_id, quote_id, purpose]
      properties:
        beneficiary_id:
          type: string
          format: uuid
          description: |
            Id of a saved beneficiary to pay (`GET /beneficiaries`) — where
            money goes. Currency must equal the quote `to` currency.
          example: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
        balance_id:
          type: string
          format: uuid
          description: |
            Source book from `GET /balances` (`data[].id`) — where money leaves.
            Currency must equal the quote `from` currency.
          example: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
        purpose:
          $ref: "#/components/schemas/PayoutPurpose"
        note:
          type: string
          description: "Free-text note. Required when `purpose` is `other`."
          example: October supplier invoice
        invoice_ref:
          type: string
          description: Optional invoice or remittance reference (business accounts).
          example: INV-2026-042
        quote_id:
          type: string
          format: uuid
          description: |
            Firm quote id from `POST /fx/quotes` (omit `purpose`, or leave empty
            for a payout quote). **Required.** Gross send and recipient amounts
            are taken from the quote — do not send `amount`. Same-currency:
            quote with `from` == `to`. Cross-currency: quote `to` must match
            the beneficiary currency.
          example: "e6bd10ee-6e53-4aaa-9cd0-a2bb980cf73e"
    PayoutFeeRequest:
      type: object
      required: [beneficiary_id, balance_id]
      properties:
        beneficiary_id:
          type: string
          format: uuid
          description: Beneficiary the fee estimate applies to (where money goes).
          example: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
        balance_id:
          type: string
          format: uuid
          description: |
            Source book from `GET /balances` (`data[].id`) — where money leaves.
          example: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
        amount:
          type: number
          format: double
          description: |
            Planned send in **major units** of the source balance (optional when
            `quote_id` or `recipient_amount` is set). See [Money amounts](/guides/money).
          example: 50000
        amount_minor:
          type: integer
          description: Exact Ledger minor units (optional alternative to `amount`).
          example: 5000000
        quote_id:
          type: string
          format: uuid
          description: |
            Firm FX quote from `POST /fx/quotes`. When set and not expired, its
            locked amounts are used (and override a matching `amount` /
            `recipient_amount`).
        recipient_amount:
          type: number
          format: double
          description: |
            Amount the **beneficiary** should receive, in their currency major
            units (from `beneficiary_id`). When `amount` is omitted, Keette
            estimates how much to debit from `balance_id`.
          example: 50000
        recipient_amount_minor:
          type: integer
          description: Exact Ledger minors for `recipient_amount` (beneficiary currency).
    PayoutFee:
      type: object
      description: |
        Nested fee estimate. Read `note` on each object. Money fields inside
        `source` / `recipient` follow [Money amounts](/guides/money).
      properties:
        object:
          type: string
          enum: [payout_fee]
        note:
          type: string
          description: Top-level developer hint.
        exact:
          type: boolean
          description: |
            `true` when same-currency or firm `quote_id`; `false` when indicative FX.
        exact_note:
          type: string
        source:
          type: object
          description: Debit side — book that will be charged.
          properties:
            object: { type: string, enum: [payout_fee_source] }
            note: { type: string }
            balance_id: { type: string, format: uuid }
            currency: { type: string }
            scale: { type: integer }
            available: { type: number, format: double }
            available_minor: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
            transfer_fee: { type: number, format: double }
            total: { type: number, format: double }
            min_payment: { type: number, format: double }
        recipient:
          type: object
          description: Credit side — what the beneficiary receives.
          properties:
            object: { type: string, enum: [payout_fee_recipient] }
            note: { type: string }
            beneficiary_id: { type: string, format: uuid }
            currency: { type: string }
            scale: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
    Swap:
      type: object
      required: [object, id, status, from, to, stan]
      properties:
        object:
          type: string
          enum: [swap]
          description: Object type discriminator.
        note:
          type: string
          description: Developer hint — `from` is the debit; `to` is the credit.
        id:
          type: string
          format: uuid
          description: Swap id.
        status:
          type: string
          enum: [processing, completed, failed, reversed]
          description: Lifecycle status of the book-to-book transfer.
        origin:
          type: string
          description: "How the swap was initiated (`keette` for API/dashboard)."
        from:
          type: object
          description: Source book (debit).
          properties:
            object: { type: string, enum: [swap_from] }
            note: { type: string }
            currency: { type: string }
            scale: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
            clear_amount: { type: string }
        to:
          type: object
          description: Destination book (credit).
          properties:
            object: { type: string, enum: [swap_to] }
            note: { type: string }
            currency: { type: string }
            scale: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
            clear_amount: { type: string }
        fx_rate:
          type: string
          description: Applied rate as a decimal string.
        quote_id:
          type: string
          format: uuid
          description: Firm quote that locked the rate.
        quote:
          type: object
          description: Nested firm quote (same amounts as `from` / `to`).
        reason:
          type: string
          description: Failure or reversal reason when applicable.
        stan:
          type: string
          description: System trace / reference shown in statements.
        created_at:
          type: string
          format: date-time
          description: Creation time (UTC).
        updated_at:
          type: string
          format: date-time
          description: Last status change (UTC).
        completed_at:
          type: string
          format: date-time
          description: "When the swap finished successfully, if completed."
    Payout:
      type: object
      required: [object, id, status, currency, amount, stan, beneficiary_id]
      properties:
        object:
          type: string
          enum: [payout]
          description: Object type discriminator.
        id:
          type: string
          format: uuid
          description: Payout id.
        status:
          type: string
          enum:
            - awaiting_auth
            - pending_approval
            - queued
            - sending
            - completed
            - failed
            - cancelled
            - rejected
            - expired
          description: |
            Lifecycle status. `pending_approval` means maker-checker is waiting
            on a second admin in the dashboard. `queued`/`sending` are in flight.
        currency:
          type: string
          description: Source book currency that was (or will be) debited.
        amount:
          type: number
          format: double
          description: Gross send in major units (6 decimal places).
        amount_minor:
          type: integer
          description: Gross send in Ledger minor units.
        fee:
          type: number
          format: double
          description: Customer-visible transfer fee (partner + margin + cross-border).
        fee_minor:
          type: integer
        transfer_fee:
          type: number
          format: double
          description: "Transfer fee component (same as `fee` for most corridors)."
        transfer_fee_minor:
          type: integer
        scheme:
          type: string
          description: Corridor scheme used for the send.
        country:
          type: string
          description: Destination country (ISO 3166-1 alpha-2).
        stan:
          type: string
          description: System trace / remittance reference.
        beneficiary_id:
          type: string
          format: uuid
          description: Recipient beneficiary id.
        purpose:
          $ref: "#/components/schemas/PayoutPurpose"
        purpose_label:
          type: string
          description: Human-readable purpose label.
        note:
          type: string
          description: Free-text note from the request.
        invoice_ref:
          type: string
          description: Invoice or remittance reference.
        quote_id:
          type: string
          format: uuid
          description: Firm FX quote used when currencies differed.
        fx_rate:
          type: string
          description: Applied FX rate when cross-currency.
        recipient_currency:
          type: string
          description: Currency credited to the beneficiary.
        recipient_amount:
          type: number
          format: double
          description: Amount the beneficiary receives (major units).
        recipient_amount_minor:
          type: integer
        recipient_scale:
          type: integer
          description: "Decimal places for `recipient_currency`."
        cancellable:
          type: boolean
          description: "Whether `POST /payouts/{id}/cancel` can still succeed."
        failure_reason:
          type: string
          description: "Partner or validation failure message when status is `failed`/`rejected`."
        authorised_at:
          type: string
          format: date-time
          description: When the send was authorised (API key or PIN).
        completed_at:
          type: string
          format: date-time
          description: When the payout reached a terminal success state.
        created_at:
          type: string
          format: date-time
          description: Creation time (UTC).
        updated_at:
          type: string
          format: date-time
          description: Last status change (UTC).
    PayinFeeRequest:
      type: object
      required: [target_currency, amount]
      properties:
        method:
          type: string
          description: |
            Funding method. Accepted values: `bank_transfer`, `momo`, `interac`,
            `crypto`. `bank_details` / `bank` are aliases for `bank_transfer`.
            Provide `method` or `mode`.
          example: bank_transfer
        mode:
          type: string
          description: |
            Alternative to `method` using prepare modes (`bank_details`,
            `crypto_address`, `momo`, `interac`). Mapped to the matching method
            for pricing.
          example: bank_details
        target_currency:
          type: string
          description: Book currency that will be credited.
          example: NGN
        amount:
          type: number
          format: double
          description: |
            Funding amount in **major units** of `currency` (or target when
            omitted). See [Money amounts](/guides/money). Optional `amount_minor`
            for exact Ledger integers.
          example: 50000
        amount_minor:
          type: integer
          description: Exact Ledger minor units (optional alternative to `amount`).
        currency:
          type: string
          description: Currency of `amount` for the fee quote; defaults to `target_currency`.
    PayinFee:
      type: object
      properties:
        object:
          type: string
          enum: [payin_fee]
          description: Object type discriminator.
        note:
          type: string
          description: Developer hint for `pay` vs `credit`.
        product:
          type: string
          description: Internal pricing product key.
        margin_source:
          type: string
          description: Pricing source for the margin line.
        pay:
          type: object
          description: Funding side — what the payer sends and the fee lines.
          properties:
            object: { type: string, enum: [payin_fee_pay] }
            note: { type: string }
            currency: { type: string }
            scale: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
            fee: { type: number, format: double }
            fee_minor: { type: integer }
            partner_fee: { type: number, format: double }
            partner_fee_minor: { type: integer }
            margin: { type: number, format: double }
            margin_minor: { type: integer }
        credit:
          type: object
          description: Expected book credit after fees.
          properties:
            object: { type: string, enum: [payin_fee_credit] }
            note: { type: string }
            currency: { type: string }
            scale: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
    PayinPreviewRequest:
      type: object
      required: [target_currency, mode, amount]
      properties:
        target_currency:
          type: string
          description: Book currency to credit.
          example: NGN
        source_currency:
          type: string
          description: Currency the payer funds in; defaults to `target_currency`.
        mode:
          type: string
          enum: [bank_details, crypto_address, momo, interac]
          description: Collection mode (same values as prepare).
          example: bank_details
        amount:
          type: number
          format: double
          description: |
            What the payer sends in `source_currency` **major units**. See
            [Money amounts](/guides/money).
          example: 50000
        amount_minor:
          type: integer
          description: Exact Ledger minor units (optional alternative to `amount`).
        channel:
          type: string
          description: Momo channel id when `mode` is `momo` (e.g. `KE-MPESA`).
        network:
          type: string
          description: Crypto network when `mode` is `crypto_address` (e.g. `base`).
    PayinPreview:
      type: object
      properties:
        object:
          type: string
          enum: [payin_preview]
          description: Object type discriminator.
        note:
          type: string
          description: Developer hint — `pay` / `fees` / `credit` / optional `fx`.
        product:
          type: string
          description: Pricing product key.
        pay:
          type: object
          description: Funding rail — what the payer sends.
          properties:
            object: { type: string, enum: [payin_preview_pay] }
            note: { type: string }
            currency: { type: string }
            scale: { type: integer }
            method: { type: string }
            mode: { type: string }
            channel: { type: string }
            network: { type: string }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
            clear_amount: { type: string }
        fees:
          type: object
          description: Fee lines on the funding side.
          properties:
            object: { type: string, enum: [payin_preview_fees] }
            note: { type: string }
            currency: { type: string }
            scale: { type: integer }
            fee: { type: number, format: double }
            fee_minor: { type: integer }
            partner_fee: { type: number, format: double }
            partner_fee_minor: { type: integer }
            margin: { type: number, format: double }
            margin_minor: { type: integer }
        credit:
          type: object
          description: What lands in the target book.
          properties:
            object: { type: string, enum: [payin_preview_credit] }
            note: { type: string }
            currency: { type: string }
            scale: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
            clear_amount: { type: string }
            gross: { type: number, format: double }
            gross_minor: { type: integer }
            clear_gross: { type: string }
        fx:
          type: object
          description: Present when source and target currencies differ.
          properties:
            object: { type: string, enum: [payin_preview_fx] }
            note: { type: string }
            rate: { type: string }
            as_of: { type: string, format: date-time }
            indicative: { type: boolean }
    PreparePayinRequest:
      type: object
      required: [target_currency, mode, amount]
      properties:
        target_currency:
          type: string
          description: Book currency to credit.
          example: NGN
        source_currency:
          type: string
          description: |
            Currency of the receive rail. Defaults to `target_currency`. For
            Interac defaults to CAD; momo may infer KES/TZS from `channel`.
        mode:
          type: string
          enum: [bank_details, crypto_address, momo, interac]
          description: How funds will arrive.
          example: bank_details
        amount:
          type: number
          format: double
          description: |
            Amount the payer sends in `source_currency` **major units**. See
            [Money amounts](/guides/money).
          example: 50000
        amount_minor:
          type: integer
          description: Exact Ledger minor units (optional alternative to `amount`).
        target_amount:
          type: number
          format: double
          description: |
            Required when `source_currency` differs from `target_currency` —
            expected credit in target **major units**.
        target_amount_minor:
          type: integer
          description: Exact Ledger minors for `target_amount`.
        network:
          type: string
          description: Crypto network (`base`, `ethereum`, …). Defaults to `base` for crypto.
        narration:
          type: string
          description: Optional payment reference / memo.
        redirect_url:
          type: string
          format: uri
          description: Required for Interac — where the payer returns after approval.
        country_code:
          type: string
          description: ISO country hint for some rails.
        msisdn:
          type: string
          description: Mobile number for momo (E.164 or local as required by channel).
        channel:
          type: string
          description: Momo channel id (e.g. `KE-MPESA`).
        payer_name:
          type: string
          description: Optional payer display name.
        payer_email:
          type: string
          format: email
          description: Optional payer email.
    CreatePayinRequest:
      type: object
      required: [method, target_currency, amount]
      properties:
        method:
          type: string
          description: "Funding method (`bank_transfer`, `momo`, `interac`, `crypto`)."
          example: bank_transfer
        target_currency:
          type: string
          description: Book currency to credit.
          example: GBP
        amount:
          type: number
          format: double
          description: |
            Amount in **major units** (target currency, unless rail fields set).
            See [Money amounts](/guides/money).
          example: 100
        amount_minor:
          type: integer
          description: Exact Ledger minor units (optional alternative to `amount`).
        rail_currency:
          type: string
          description: Optional rail currency when the payer pays in a different currency.
        rail_amount:
          type: number
          format: double
          description: Amount in `rail_currency` **major units** when set.
        rail_amount_minor:
          type: integer
          description: Exact Ledger minors for `rail_amount`.
        redirect_url:
          type: string
          format: uri
          description: Return URL after hosted checkout (required for open banking / Interac / crypto checkout).
        country_code:
          type: string
          description: ISO country hint.
        narration:
          type: string
          description: Optional payment memo.
        msisdn:
          type: string
          description: Mobile number for momo.
        channel:
          type: string
          description: Momo channel id.
        payer_name:
          type: string
          description: Optional payer name.
        payer_email:
          type: string
          format: email
          description: Optional payer email.
    PayinSources:
      type: object
      properties:
        object:
          type: string
          enum: [payin_sources]
          description: Object type discriminator.
        target_currency:
          type: string
          description: Book currency you queried.
        sources:
          type: array
          description: Available funding origins and modes.
          items:
            type: object
            properties:
              kind:
                type: string
                description: "Origin kind (`bank`, `momo`, `crypto`, …)."
              currency:
                type: string
                description: Source / rail currency for this origin.
              modes:
                type: array
                description: Collection modes under this origin.
                items:
                  type: object
                  properties:
                    mode:
                      type: string
                      description: Mode id for prepare (`bank_details`, …).
                    channels:
                      type: array
                      items: { type: string }
                      description: Momo channels when applicable.
                    networks:
                      type: array
                      items: { type: string }
                      description: Crypto networks when applicable.
    Payin:
      type: object
      properties:
        object:
          type: string
          enum: [payin]
          description: Object type discriminator.
        note:
          type: string
          description: Developer hint — `payer` / `credit` / `collection`.
        id:
          type: string
          format: uuid
          description: Payin attempt id.
        stan:
          type: string
          description: System trace / reference.
        status:
          type: string
          description: "Lifecycle status (`pending`, `processing`, `completed`, `failed`, …)."
        payer:
          type: object
          description: What the payer sends on the rail.
          properties:
            object: { type: string, enum: [payin_payer] }
            note: { type: string }
            method: { type: string }
            currency: { type: string }
            scale: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
            clear_amount: { type: string }
        credit:
          type: object
          description: What credits your book.
          properties:
            object: { type: string, enum: [payin_credit] }
            note: { type: string }
            currency: { type: string }
            scale: { type: integer }
            amount: { type: number, format: double }
            amount_minor: { type: integer }
            clear_amount: { type: string }
            requested: { type: number, format: double }
            requested_minor: { type: integer }
        collection:
          type: object
          description: How to collect — checkout URL and/or receive instructions.
          properties:
            object: { type: string, enum: [payin_collection] }
            note: { type: string }
            mode: { type: string }
            source_kind: { type: string }
            network: { type: string }
            checkout_url: { type: string, format: uri }
            redirect_url: { type: string, format: uri }
            instructions:
              type: object
              additionalProperties: true
              description: |
                Receive instructions for the payer (account number, bank name,
                wallet address, etc.). Shape depends on `mode`.
        failure_reason:
          type: string
          description: Failure message when status is failed.
        created_at:
          type: string
          format: date-time
          description: Creation time (UTC).
        updated_at:
          type: string
          format: date-time
          description: Last status change (UTC).
        completed_at:
          type: string
          format: date-time
          description: When the deposit completed, if successful.
        livemode:
          type: boolean
          description: "`true` when created with a live key."
        environment:
          type: string
          enum: [live, sandbox]
          description: Environment of the creating API key.
