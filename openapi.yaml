openapi: 3.1.0
info:
  title: Keette API
  version: "1.0.0"
  description: |
    Public HTTP API for Keette workspaces. One base URL — live vs sandbox is
    selected by your API key (`sk_live_…` / `sk_test_…`).

    Endpoints are added as each implementation phase ships.
  contact:
    name: Keette Support
    email: talk@keette.com
servers:
  - url: https://1178-41-90-137-132.ngrok-free.app/v1
    description: Local tunnel (ngrok → core :8080)
  - url: https://api.keette.com/v1
    description: Production
security:
  - bearerAuth: []
tags:
  - name: Account
    description: Identity for the authenticating API key
  - name: Utilities
    description: |
      Lookup helpers for building beneficiaries and payouts — corridors
      (schemes + routing field keys), bank directory codes, account resolve,
      and SWIFT/BIC lookup.
  - name: Balances
    description: Wallet books
  - name: Beneficiaries
    description: Payout recipients
  - name: Transactions
    description: Unified transaction index
  - name: FX
    description: Indicative rates and firm quotes
  - name: Payouts
    description: Send money to a beneficiary
  - name: Payins
    description: Collect money into your books
  - name: Swaps
    description: FX between your own books
  - name: Webhooks
    description: Durable event log, ping, and webhook delivery helpers
paths:
  /me:
    get:
      operationId: getMe
      tags: [Account]
      summary: Me
      description: |
        Returns the workspace and environment bound to the API key.
      responses:
        "200":
          description: Key context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
              examples:
                sandbox:
                  value:
                    object: me
                    tenant_id: "ten_01EXAMPLE"
                    environment: sandbox
                    key:
                      id: "key_01EXAMPLE"
                      prefix: "sk_test_19d0"
                      name: Sample Keys
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /events:
    get:
      operationId: listEvents
      tags: [Webhooks]
      summary: Events
      description: |
        Returns durable events for the environment bound to the API key
        (newest first). Use `ending_before` (unix seconds) to page older.
      parameters:
        - name: limit
          in: query
          description: Max events to return (1–100).
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - name: ending_before
          in: query
          description: Unix timestamp; return events strictly older than this.
          schema:
            type: integer
      responses:
        "200":
          description: Event list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum: [list]
                    description: Object type discriminator for list responses.
                  data:
                    type: array
                    description: Events newest first.
                    items:
                      $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /events/{id}:
    get:
      operationId: getEvent
      tags: [Webhooks]
      summary: Event
      description: |
        Returns one durable event by id for the environment bound to the API
        key. Use this to fetch a missed delivery when you already have the id
        (from a webhook body or a prior list poll).
      parameters:
        - name: id
          in: path
          required: true
          description: Event id (UUID).
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Forbidden"
  /ping:
    post:
      operationId: ping
      tags: [Webhooks]
      summary: Ping
      description: |
        Persists `event.ping` and queues a delivery when the env webhook is
        active and subscribed to that type.
      responses:
        "200":
          description: Queued event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /balances:
    get:
      operationId: listBalances
      tags: [Balances]
      summary: Balances
      description: |
        Books for this workspace. Money fields are major-unit floats with 6
        decimal places, plus `clear_balance` / `clear_held` and `*_minor`.
        See [Money amounts](/guides/money).
      responses:
        "200":
          description: Balance list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum: [list]
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Balance"
              examples:
                books:
                  value:
                    object: list
                    data:
                      - object: balance
                        id: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
                        currency: EUR
                        available: 20000.000000
                        available_minor: 2000000
                        clear_available: "20,000.00"
                        clear_balance: "20,000.00"
                        held: 0.000000
                        held_minor: 0
                        clear_held: "0.00"
                        scale: 2
                        livemode: true
                        environment: live
                        details_available: false
        "401":
          $ref: "#/components/responses/Unauthorized"
  /transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: Transactions
      description: |
        List activity. Each row includes `counterparty` (with `id` when the
        recipient is a saved beneficiary) and `quote.id` when a firm FX quote
        was used. Amounts follow [Money amounts](/guides/money) (6dp floats +
        `clear_*` + `*_minor`).
      parameters:
        - name: limit
          in: query
          description: Page size (default 25).
          schema: { type: integer, default: 25 }
        - name: page
          in: query
          description: 1-based page index.
          schema: { type: integer, default: 1 }
        - name: kind
          in: query
          description: "Filter by kind: `send`, `receive`, `swap`, or `save` (comma-separated allowed)."
          schema:
            type: string
            enum: [send, receive, swap, save]
        - name: status
          in: query
          description: "Filter by status: `processing`, `completed`, `failed`, or `reversed` (comma-separated allowed)."
          schema:
            type: string
            enum: [processing, completed, failed, reversed]
        - name: currency
          in: query
          description: Filter by book currency (ISO 4217 / stablecoin).
          schema: { type: string }
      responses:
        "200":
          description: Transaction list
        "401":
          $ref: "#/components/responses/Unauthorized"
  /transactions/{id}:
    get:
      operationId: getTransaction
      tags: [Transactions]
      summary: Transaction
      description: |
        Full transaction: timeline, source detail for the underlying send /
        receive / swap / save, expanded `counterparty` (beneficiary or sender
        fields), and `quote` (id, rate, currencies, amounts) when FX was locked.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Transaction with timeline and source detail
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/Forbidden"
  /beneficiaries:
    get:
      operationId: listBeneficiaries
      tags: [Beneficiaries]
      summary: Beneficiaries
      parameters:
        - name: page
          in: query
          description: 1-based page index.
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, default: 20 }
        - name: status
          in: query
          description: "`active` (default), `archived`, or `all`."
          schema: { type: string }
        - name: currency
          in: query
          description: Filter by payout currency.
          schema: { type: string }
        - name: q
          in: query
          description: Free-text search on name / nickname / route label.
          schema: { type: string }
      responses:
        "200":
          description: Beneficiary list
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createBeneficiary
      tags: [Beneficiaries]
      summary: Create Beneficiary
      description: |
        Save a payout recipient. Scheme and routing keys must match a corridor
        from `GET /corridors`. Email and a street/city/country address are
        required. Optional `relationship` must be a code from
        [Relationships & purposes](/guides/relationships-and-purposes)
        (also returned on `GET /corridors`). Emits `event.beneficiary.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBeneficiaryRequest"
            examples:
              ng_nip:
                summary: Nigerian bank account (individual)
                value:
                  kind: individual
                  first_name: Ada
                  last_name: Okoye
                  email: ada@example.com
                  currency: NGN
                  country: NG
                  scheme: ng_nip
                  relationship: supplier
                  holder_name: Ada Okoye
                  address:
                    line_1: 12 Admiralty Way
                    city: Lagos
                    country: NG
                  routing:
                    bank_code: "044"
                    account_number: "0690000031"
      responses:
        "200":
          description: Created beneficiary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /beneficiaries/{id}:
    get:
      operationId: getBeneficiary
      tags: [Beneficiaries]
      summary: Beneficiary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Beneficiary
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      operationId: updateBeneficiary
      tags: [Beneficiaries]
      summary: Update Beneficiary
      description: |
        Update mutable fields only (nickname, email, relationship, address).
        `relationship` must be a code from
        [Relationships & purposes](/guides/relationships-and-purposes).
        Routing and scheme cannot change — create a new beneficiary instead.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: Beneficiary id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBeneficiaryRequest"
            examples:
              nickname:
                value:
                  nickname: Ada (supplier)
                  email: ada@example.com
      responses:
        "200":
          description: Updated beneficiary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Beneficiary"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /beneficiaries/{id}/archive:
    post:
      operationId: archiveBeneficiary
      tags: [Beneficiaries]
      summary: Archive Beneficiary
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Archived beneficiary
        "401":
          $ref: "#/components/responses/Unauthorized"
  /corridors:
    get:
      operationId: listCorridors
      tags: [Utilities]
      summary: Corridors
      description: |
        Payout schemes available to this workspace. Use each offer's `scheme`
        on `POST /beneficiaries`, and its `fields[].key` values as `routing`
        keys (camelCase; snake_case aliases accepted). Also returns allowed
        `relationships` codes — full list in
        [Relationships & purposes](/guides/relationships-and-purposes).

        Optional `country` is an **ISO 3166-1 alpha-2** code (**2 letters**) —
        e.g. `NG`. When set, only corridors that reach that country are
        returned (see [Country codes](/guides/country-codes)).
      parameters:
        - name: country
          in: query
          required: false
          description: |
            ISO 3166-1 alpha-2 destination country. Omit to list every corridor.
          schema:
            type: string
            minLength: 2
            maxLength: 2
            pattern: "^[A-Za-z]{2}$"
          example: NG
      responses:
        "200":
          description: Corridor catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum: [list]
                  country:
                    type: string
                    description: Echoed when the `country` query was set.
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                  relationships:
                    type: array
                    items:
                      type: string
              examples:
                ng:
                  summary: Filtered to Nigeria
                  value:
                    object: list
                    country: NG
                    data:
                      - scheme: ng_nip
                        label: Nigerian bank transfer
                        method: bank
                        currencies: [NGN]
                        countries: [NG]
                        fields:
                          - key: bankCode
                            label: Bank
                            kind: bank
                          - key: accountNumber
                            label: Account number
                            kind: account
                    relationships:
                      [
                        vendor,
                        supplier,
                        contractor,
                        employee,
                        customer,
                        partner,
                        family,
                        self,
                        other,
                      ]
        "401":
          $ref: "#/components/responses/Unauthorized"
  /banks:
    get:
      operationId: listBanks
      tags: [Utilities]
      summary: Banks
      description: |
        Bank directory for a country. Use each bank's `code` as
        `routing.bank_code` (or `bankCode`) when creating a beneficiary on a
        local bank corridor (e.g. `ng_nip`).

        `country` is an **ISO 3166-1 alpha-2** code (**2 letters**, not 3) —
        e.g. Nigeria is `NG` (not `NGA`). See the full code list in
        [Country codes](/guides/country-codes). Today the directory is
        populated for Nigeria (`NG`); other codes may return an empty list
        until that country's banks are synced.
      parameters:
        - name: country
          in: query
          required: true
          description: |
            ISO 3166-1 alpha-2 country code (**2 letters**). Full list:
            [Country codes](/guides/country-codes). Example: `NG`.
          schema:
            type: string
            minLength: 2
            maxLength: 2
          example: NG
      responses:
        "200":
          description: Bank list
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum: [list]
                  country:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bank"
              examples:
                ng:
                  value:
                    object: list
                    country: NG
                    data:
                      - object: bank
                        country: NG
                        currency: NGN
                        code: "058"
                        name: Guaranty Trust Bank
                      - object: bank
                        country: NG
                        currency: NGN
                        code: "044"
                        name: Access Bank
        "401":
          $ref: "#/components/responses/Unauthorized"
  /banks/ke:
    get:
      operationId: resolveKenya
      tags: [Utilities]
      summary: Resolve Kenya
      description: |
        Kenya bank and deposit-taking MFI catalog (M-Pesa → bank paybill codes).
        Omit filters to list all. Pass `code` (paybill) and/or `name` to match
        one or more entries. Use `code` as `routing.bank_code` on `ke_eft`
        beneficiaries.
      parameters:
        - name: code
          in: query
          required: false
          description: |
            Paybill / bank code (exact). Aliases `bank_code` and `bankCode`.
          schema: { type: string, example: "247247" }
        - name: name
          in: query
          required: false
          description: |
            Case-insensitive name substring. Alias `q`.
          schema: { type: string, example: Equity }
      responses:
        "200":
          description: Matching Kenya banks
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, enum: [list] }
                  country: { type: string, example: KE }
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
              examples:
                equity:
                  value:
                    object: list
                    country: KE
                    data:
                      - object: bank
                        country: KE
                        currency: KES
                        code: "247247"
                        name: Equity Bank
                        kind: bank
                        ussd: "*247#"
                all:
                  summary: Full catalog when no filters
                  value:
                    object: list
                    country: KE
                    data:
                      - object: bank
                        country: KE
                        currency: KES
                        code: "522522"
                        name: KCB
                        kind: bank
                        ussd: "*522#"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No bank matched the filters
  /banks/resolve:
    get:
      operationId: resolveBank
      tags: [Utilities]
      summary: Resolve Nigeria
      description: |
        Looks up the registered account holder name for a Nigerian bank account
        using a bank code from `GET /banks?country=NG`. Capped per workspace.
      parameters:
        - name: country
          in: query
          required: true
          description: |
            ISO 3166-1 alpha-2 (**2 letters**). Same codes as `GET /banks`
            ([Country codes](/guides/country-codes)).
          schema: { type: string, minLength: 2, maxLength: 2, example: NG }
        - name: bank_code
          in: query
          required: true
          description: Code from `GET /banks` (`bankCode` alias accepted).
          schema: { type: string, example: "044" }
        - name: account_number
          in: query
          required: true
          description: |
            Bank account number for that corridor (`accountNumber` alias
            accepted). Format depends on the country/rail — not limited to a
            single national scheme.
          schema: { type: string, example: "0690000031" }
      responses:
        "200":
          description: Resolved account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankResolve"
              examples:
                ok:
                  value:
                    object: bank_resolve
                    account_number: "0690000031"
                    account_name: Keette Sandbox Test
                    bank_code: "044"
                    bank_name: Access Bank
        "401":
          $ref: "#/components/responses/Unauthorized"
  /banks/bic/{bic}:
    get:
      operationId: getBankBic
      tags: [Utilities]
      summary: Resolve Swift Code
      description: |
        Looks up a SWIFT/BIC (no bank code required) in the global public
        registry and returns bank name, country, and address when known.
        Same helper the dashboard uses when creating wire beneficiaries.
        `found=false` is not an error — the customer can still type details.
      parameters:
        - name: bic
          in: path
          required: true
          description: 8 or 11 character SWIFT / BIC (any country).
          schema: { type: string, example: NWBKGB2L }
      responses:
        "200":
          description: BIC lookup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BankBic"
              examples:
                found:
                  value:
                    object: bank_bic
                    bic: NWBKGB2L
                    country: GB
                    found: true
                    bank_name: NATIONAL WESTMINSTER BANK PUBLIC LIMITED COMPANY
                    address:
                      city: LONDON
                      country: GB
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fx/rate:
    get:
      operationId: getFxRate
      tags: [FX]
      summary: FX Rate
      description: |
        Indicative mid-market rate for UI estimates. Not a lock — use
        `POST /fx/quotes` before moving money. When the partner cannot price
        the pair, a market failover may return with `disclaimer` set to
        "Rates are indicative and not final."
      parameters:
        - name: from
          in: query
          required: true
          description: Source currency code.
          schema: { type: string, example: USD }
        - name: to
          in: query
          required: true
          description: Destination currency code.
          schema: { type: string, example: NGN }
      responses:
        "200":
          description: Rate
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/FxRate"
              example:
                data:
                  from: NGN
                  to: KES
                  rate: "0.096585"
                  asOf: "2026-10-31T07:00:00Z"
                  indicative: true
                  disclaimer: Rates are indicative and not final.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /fx/quotes:
    post:
      operationId: createFxQuote
      tags: [FX]
      summary: FX Quote
      description: |
        Lock a firm rate (and amounts). Pass the returned `id` as `quote_id`
        to `POST /payouts` (required) or `POST /swaps`. Set `purpose` to
        classify the lock (`payout`, `swap`, `transfer`, `mint`, `otc`).
        Same-currency payouts: set `from` equal to `to` for an identity
        quote (rate `1`). For `swap` / `transfer` / `mint` / `otc`, both
        currencies must already exist on `GET /balances`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [from, to]
              properties:
                from:
                  type: string
                  description: Source book currency (ISO 4217 or stablecoin code).
                  example: USD
                to:
                  type: string
                  description: Destination book currency.
                  example: NGN
                amount_from:
                  type: number
                  format: double
                  description: |
                    Source amount in **major units**. Set exactly one of
                    `amount_from` or `amount_to`. Optional `amount_from_minor`
                    for exact Ledger integers. See [Money amounts](/guides/money).
                  example: 100
                amount_from_minor:
                  type: integer
                  description: Exact Ledger minor units for `amount_from`.
                amount_to:
                  type: number
                  format: double
                  description: Destination amount in major units. Set exactly one of `amount_from` or `amount_to`.
                amount_to_minor:
                  type: integer
                  description: Exact Ledger minor units for `amount_to`.
                purpose:
                  type: string
                  enum: [payout, swap, transfer, mint, otc]
                  description: |
                    Why this quote is locked.
                    - `payout` (default if omitted) — pass to `POST /payouts`
                    - `swap` / `transfer` — pass to `POST /swaps` (own books)
                    - `mint` — stablecoin / mint conversion into an own book
                    - `otc` — OTC desk conversion into an own book
            examples:
              swap:
                summary: Quote for an internal swap
                value:
                  from: USD
                  to: NGN
                  amount_from: 100
                  purpose: swap
              transfer:
                summary: Quote for a book transfer
                value:
                  from: EUR
                  to: GBP
                  amount_from: 250
                  purpose: transfer
              mint:
                summary: Quote for a mint conversion
                value:
                  from: USD
                  to: USDC
                  amount_from: 1000
                  purpose: mint
              otc:
                summary: Quote for an OTC conversion
                value:
                  from: USD
                  to: NGN
                  amount_to: 5000000
                  purpose: otc
              payout:
                summary: Quote for a cross-currency payout
                value:
                  from: USD
                  to: NGN
                  amount_from: 100
                  purpose: payout
      responses:
        "200":
          description: Firm quote
          content:
            application/json:
              schema:
                type: object
                properties:
                  object:
                    type: string
                    enum: [fx_quote]
                    description: Object type discriminator.
                  id:
                    type: string
                    format: uuid
                    description: "Firm quote id — pass as `quote_id` to payouts or swaps."
                  purpose:
                    type: string
                    enum: [payout, swap, transfer, mint, otc]
                    description: Purpose locked on the quote.
                  from:
                    type: string
                    description: Source currency.
                  to:
                    type: string
                    description: Destination currency.
                  amount_from:
                    type: integer
                    description: Debit amount in Ledger minor units.
                  amount_to:
                    type: integer
                    description: Credit amount in Ledger minor units at the locked rate.
                  scale_from:
                    type: integer
                    description: "Decimal places for `from` (usually 2)."
                  scale_to:
                    type: integer
                    description: "Decimal places for `to`."
                  rate:
                    type: string
                    description: "Locked mid-market-style rate as a decimal string (`to` per 1 `from`)."
                  expires_at:
                    type: string
                    format: date-time
                    description: When this quote can no longer be used.
                  valid_for_seconds:
                    type: integer
                    description: Seconds remaining at creation time.
              examples:
                quote:
                  value:
                    object: fx_quote
                    id: "e6bd10ee-6e53-4aaa-9cd0-a2bb980cf73e"
                    from: USD
                    to: NGN
                    amount_from: 10000
                    amount_to: 1550000
                    scale_from: 2
                    scale_to: 2
                    rate: "155.00"
                    expires_at: "2026-10-27T13:02:00Z"
                    valid_for_seconds: 90
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payouts:
    post:
      operationId: createPayout
      tags: [Payouts]
      summary: Create Payout
      description: |
        Create and authorise a send in one step. The API key replaces the
        workspace PIN. Requires `Idempotency-Key` and a firm `quote_id` from
        `POST /fx/quotes` — amounts come from the quote (do not send
        `amount`). The quote `from` currency must match the source
        `balance_id` currency; the quote `to` currency must match the
        beneficiary currency. Same-currency sends use an identity quote
        (`from` == `to`, rate `1`). If maker-checker applies, status is
        `pending_approval` until a second admin approves in the dashboard.
        `purpose` must be a code from
        [Relationships & purposes](/guides/relationships-and-purposes)
        (or `GET /payouts/purposes`).
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: |
            Client-generated key so retries do not create duplicate payouts.
            Reuse the same key for the same logical send.
          schema:
            type: string
            minLength: 8
            maxLength: 100
          example: payout-2026-10-27-001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePayoutRequest"
            examples:
              same_currency:
                summary: Same-currency send (quote from=to)
                value:
                  beneficiary_id: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
                  balance_id: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
                  purpose: supplier_goods
                  invoice_ref: INV-2026-042
                  note: October supplier invoice
                  quote_id: "e6bd10ee-6e53-4aaa-9cd0-a2bb980cf73e"
              cross_currency:
                summary: Cross-currency (firm FX quote)
                value:
                  beneficiary_id: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
                  balance_id: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
                  purpose: services
                  invoice_ref: INV-2026-042
                  quote_id: "e6bd10ee-6e53-4aaa-9cd0-a2bb980cf73e"
      responses:
        "200":
          description: "Payout (queued, pending_approval, or rejected)"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
              examples:
                queued:
                  value:
                    object: payout
                    id: "6e0e15cf-8736-44fc-bb9b-372eb7b14145"
                    status: queued
                    currency: NGN
                    amount: 5000000
                    fee: 15000
                    transfer_fee: 10000
                    scheme: ng_nip
                    country: NG
                    stan: OUT-2610-ABCDEF12
                    beneficiary_id: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
                    purpose: supplier_goods
                    purpose_label: Supplier payment for goods
                    note: October supplier invoice
                    invoice_ref: INV-2026-042
                    cancellable: false
                    created_at: "2026-10-27T13:00:00Z"
                    updated_at: "2026-10-27T13:00:01Z"
                    authorised_at: "2026-10-27T13:00:01Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payouts/fee:
    post:
      operationId: payoutFee
      tags: [Payouts]
      summary: Payout Fee
      description: |
        Estimate transfer fee before creating a payout. `balance_id` is the
        source book (`GET /balances`); `beneficiary_id` is where money goes.
        Provide at least one of `amount`, `recipient_amount`, or an unexpired
        `quote_id`. `recipient_amount` is what the beneficiary receives; when
        only that is set, Keette estimates how much to debit from the balance.
        Refuses with `insufficient_funds` when available balance cannot cover
        the gross send (same rule as create).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutFeeRequest"
            examples:
              estimate:
                summary: Fee for a NGN send
                value:
                  beneficiary_id: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
                  balance_id: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
                  amount: 50000
              recipient_side:
                summary: Cross-currency from what the beneficiary gets
                value:
                  beneficiary_id: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
                  balance_id: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
                  recipient_amount: 50000
              with_quote:
                summary: Locked FX quote
                value:
                  beneficiary_id: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
                  balance_id: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
                  quote_id: "e6bd10ee-6e53-4aaa-9cd0-a2bb980cf73e"
      responses:
        "200":
          description: Fee quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutFee"
              examples:
                fee:
                  value:
                    object: payout_fee
                    note: "Fee estimate: `source` is what leaves your book; `recipient` is what they get."
                    exact: true
                    exact_note: Same-currency or firm quote — amounts match what create will hold.
                    source:
                      object: payout_fee_source
                      note: "Book that will be debited. `total` is what leaves the balance; `transfer_fee` is carved from that total (not added on top)."
                      balance_id: "3f1c0b2a-8d4e-4a91-9c2f-1a2b3c4d5e6f"
                      currency: EUR
                      scale: 2
                      available: 100.000000
                      available_minor: 10000
                      clear_available: "100.00"
                      amount: 6.910000
                      amount_minor: 691
                      clear_amount: "6.91"
                      transfer_fee: 0.040000
                      transfer_fee_minor: 4
                      clear_transfer_fee: "0.04"
                      total: 6.910000
                      total_minor: 691
                      clear_total: "6.91"
                      min_payment: 0.000000
                      min_payment_minor: 0
                      clear_min_payment: "0.00"
                    recipient:
                      object: payout_fee_recipient
                      note: What the beneficiary receives in their currency (from beneficiary_id).
                      beneficiary_id: "bbd938a2-dbbe-43bf-bfb9-1c5dbe444523"
                      currency: NGN
                      scale: 2
                      amount: 10000.000000
                      amount_minor: 1000000
                      clear_amount: "10,000.00"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payouts/purposes:
    get:
      operationId: payoutPurposes
      tags: [Payouts]
      summary: Purposes
      description: |
        Allowed purpose codes (and document rules) for this workspace.
        Static list with labels:
        [Relationships & purposes](/guides/relationships-and-purposes).
        Business workspaces omit `family_support`.
      responses:
        "200":
          description: Purpose rules
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              examples:
                business:
                  value:
                    purposes:
                      - code: supplier_goods
                        label: Supplier payment for goods
                      - code: services
                        label: Payment for services
                      - code: professional_fees
                        label: Professional fees
                      - code: salaries
                        label: Salaries and payroll
                      - code: rent
                        label: Rent
                      - code: tax
                        label: Tax payment
                      - code: loan_repayment
                        label: Loan repayment
                      - code: intercompany
                        label: Intercompany transfer
                      - code: investment
                        label: Investment
                      - code: other
                        label: Other
                    documentRules:
                      - currency: NGN
                        thresholdMinor: 500000000
        "401":
          $ref: "#/components/responses/Unauthorized"
