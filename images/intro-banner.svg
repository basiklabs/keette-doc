<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" role="img" aria-label="Keette Developers  secure, connected payments API">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#061F00"/>
      <stop offset="55%" stop-color="#0A2E02"/>
      <stop offset="100%" stop-color="#14380A"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#A5E119" stop-opacity="0"/>
      <stop offset="45%" stop-color="#A5E119" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#A5E119" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#A5E119" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="280" rx="20" fill="url(#bg)"/>
  <rect width="960" height="280" rx="20" fill="url(#grid)"/>
  <ellipse cx="720" cy="140" rx="280" ry="120" fill="url(#glow)"/>

  <!-- Connecting lines between cubes -->
  <g stroke="#A5E119" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M548 118 L610 98"/>
    <path d="M548 162 L610 182"/>
    <path d="M678 98 L742 118"/>
    <path d="M678 182 L742 162"/>
    <path d="M610 112 L610 168" stroke-dasharray="3 5" stroke-opacity="0.35"/>
    <path d="M742 130 L802 140" stroke-opacity="0.55"/>
  </g>

  <!-- Cube cluster (isometric-ish) -->
  <g transform="translate(520 70)">
    <!-- left cube -->
    <g>
      <path d="M28 40 L56 24 L84 40 L56 56 Z" fill="#A5E119" fill-opacity="0.22" stroke="#A5E119" stroke-width="1.4"/>
      <path d="M28 40 L28 72 L56 88 L56 56 Z" fill="#061F00" fill-opacity="0.35" stroke="#A5E119" stroke-width="1.2" stroke-opacity="0.7"/>
      <path d="M84 40 L84 72 L56 88 L56 56 Z" fill="#A5E119" fill-opacity="0.12" stroke="#A5E119" stroke-width="1.2" stroke-opacity="0.65"/>
    </g>
    <!-- top cube -->
    <g transform="translate(82 -18)">
      <path d="M28 40 L56 24 L84 40 L56 56 Z" fill="#A5E119" fill-opacity="0.35" stroke="#A5E119" stroke-width="1.5"/>
      <path d="M28 40 L28 72 L56 88 L56 56 Z" fill="#061F00" fill-opacity="0.4" stroke="#A5E119" stroke-width="1.2" stroke-opacity="0.75"/>
      <path d="M84 40 L84 72 L56 88 L56 56 Z" fill="#A5E119" fill-opacity="0.16" stroke="#A5E119" stroke-width="1.2" stroke-opacity="0.7"/>
    </g>
    <!-- bottom cube -->
    <g transform="translate(82 46)">
      <path d="M28 40 L56 24 L84 40 L56 56 Z" fill="#A5E119" fill-opacity="0.2" stroke="#A5E119" stroke-width="1.3"/>
      <path d="M28 40 L28 72 L56 88 L56 56 Z" fill="#061F00" fill-opacity="0.35" stroke="#A5E119" stroke-width="1.2" stroke-opacity="0.65"/>
      <path d="M84 40 L84 72 L56 88 L56 56 Z" fill="#A5E119" fill-opacity="0.1" stroke="#A5E119" stroke-width="1.2" stroke-opacity="0.6"/>
    </g>
    <!-- right cube -->
    <g transform="translate(164 14)">
      <path d="M28 40 L56 24 L84 40 L56 56 Z" fill="#A5E119" fill-opacity="0.28" stroke="#A5E119" stroke-width="1.4"/>
      <path d="M28 40 L28 72 L56 88 L56 56 Z" fill="#061F00" fill-opacity="0.38" stroke="#A5E119" stroke-width="1.2" stroke-opacity="0.7"/>
      <path d="M84 40 L84 72 L56 88 L56 56 Z" fill="#A5E119" fill-opacity="0.14" stroke="#A5E119" stroke-width="1.2" stroke-opacity="0.65"/>
    </g>
  </g>

  <!-- Security node -->
  <g transform="translate(800 92)">
    <circle cx="48" cy="48" r="44" fill="#A5E119" fill-opacity="0.1" stroke="#A5E119" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="48" cy="48" r="34" fill="#061F00" fill-opacity="0.55" stroke="#A5E119" stroke-opacity="0.4" stroke-width="1"/>
    <!-- shield -->
    <path d="M48 22 L68 30 L68 48 C68 60 58 70 48 74 C38 70 28 60 28 48 L28 30 Z"
          fill="none" stroke="#A5E119" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- lock body -->
    <rect x="40" y="44" width="16" height="14" rx="2.5" fill="#A5E119"/>
    <path d="M43 44 V39 C43 35.5 45.5 33 48 33 C50.5 33 53 35.5 53 39 V44"
          fill="none" stroke="#A5E119" stroke-width="2" stroke-linecap="round"/>
    <circle cx="48" cy="51" r="1.6" fill="#061F00"/>
  </g>

  <!-- Keette mark -->
  <g transform="translate(36 54) scale(0.22)">
    <path d="M118.399,382.509c22.368,-28.96 39.079,-67.681 40.502,-88.961c39.622,-19.324 66.594,-44.312 77.113,-76.663l-9.644,99.862c-43.594,18.74 -78.725,34.611 -107.971,65.762Z" fill="#A5E119"/>
    <path d="M427.854,331.165c-35.997,-6.588 -84.82,9.389 -104.383,17.89c-35.349,-26.339 -69.925,-38.842 -103.498,-33.347l91.303,-47.48c36.651,30.139 75.479,51.245 116.579,62.937Z" fill="#FFFFFF" fill-opacity="0.92"/>
    <path d="M78.015,422.349l18.296,22.75c11.991,14.905 34.262,16.111 47.789,2.583c72.307,-89.518 147.714,-95.517 226.891,0l0.118,0.121c13.081,13.081 34.477,12.451 46.764,-1.375l21.407,-24.079c-173.004,-153.984 -212.572,-151.478 -361.265,0Z" fill="#A5E119"/>
    <path d="M220.705,91.25c13.382,34.06 43.86,68.809 61.395,80.948c-3.741,43.925 3.867,79.898 26.237,105.527l-79.642,-54.231c6.283,-47.036 3.743,-91.157 -7.99,-132.243Z" fill="#FFFFFF" fill-opacity="0.92"/>
    <path d="M214.995,42.753l-28.915,4.034c-18.945,2.643 -31.406,21.143 -26.738,39.692c39.738,107.997 6.195,175.797 -116.417,194.747l-0.164,0.043c-17.941,4.515 -28.376,23.202 -22.817,40.844l9.688,30.726c220.935,-69.481 239.089,-104.731 185.363,-310.085Z" fill="#FFFFFF" fill-opacity="0.92"/>
    <path d="M297.142,48.364l28.915,4.031c18.945,2.645 31.406,21.143 26.738,39.692c-39.738,107.997 -6.195,175.797 116.417,194.747l0.167,0.043c17.938,4.516 28.376,23.202 22.814,40.844l-9.688,30.726c-220.935,-69.481 -239.086,-104.731 -185.363,-310.082Z" fill="#FFFFFF" fill-opacity="0.92"/>
  </g>

  <text x="48" y="188" fill="#FFFFFF" font-family="Uncut Sans, ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="650" letter-spacing="-0.03em">Keette Developers</text>
  <text x="48" y="224" fill="#A5E119" font-family="Uncut Sans, ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="500" opacity="0.95">Secure rails. Connected books. One public API.</text>
  <text x="48" y="250" fill="#FFFFFF" font-family="Uncut Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" opacity="0.55">Signed webhooks · API keys · Live &amp; sandbox</text>
</svg>
